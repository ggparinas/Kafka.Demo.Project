services:
  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      # === KRaft Configuration ===
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_NODE_ID=1
      # The controller needs its own listener. We use port 9094 for this.
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9094
      
      # === Listener Configuration ===
      # Define three listeners:
      # 1. CONTROLLER for KRaft consensus
      # 2. INTERNAL for container-to-container communication
      # 3. EXTERNAL for communication from the host machine
      - KAFKA_CFG_LISTENERS=INTERNAL://:9093,EXTERNAL://:9092,CONTROLLER://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9093,EXTERNAL://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL

  kafka-api:
    build: ./KafkaWithCapExample
    container_name: kafka-with-cap-example
    # This policy will restart the container if it fails (e.g., if Kafka isn't ready yet)
    restart: always 
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # All services will use the INTERNAL listener to talk to the broker
      - KafkaBootstrapServers=kafka:9093 
    depends_on:
      - kafka

  node-consumer:
    build: ./node-consumer
    container_name: nodejs-kafka-consumer
    # This policy will restart the container if it fails
    restart: always 
    environment:
      # All services will use the INTERNAL listener to talk to the broker
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093 
    depends_on:
      - kafka